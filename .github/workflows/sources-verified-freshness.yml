name: Sources Verified Freshness

on:
  schedule:
    # First day of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-freshness:
    name: Detect stale Sources Verified badges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan resources/ for stale Sources Verified badges
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          # Stale threshold = 180 days
          THRESHOLD=$(date -u -d '180 days ago' +%Y-%m-%d)
          echo "Stale threshold: anything older than $THRESHOLD"

          # Output file collects findings
          : > stale-list.md
          STALE_COUNT=0

          for f in resources/*.md; do
            [ -f "$f" ] || continue
            DATE=$(grep -oE 'Sources Verified \([0-9]{4}-[0-9]{2}-[0-9]{2}\)' "$f" \
                   | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' \
                   | head -1)
            if [ -z "${DATE:-}" ]; then
              continue
            fi
            if [[ "$DATE" < "$THRESHOLD" ]]; then
              echo "- \`$f\` last verified **$DATE** (>180 days old)" >> stale-list.md
              STALE_COUNT=$((STALE_COUNT + 1))
            fi
          done

          echo "stale_count=$STALE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$STALE_COUNT" -gt 0 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            cat stale-list.md
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "All Sources Verified badges are within the 180-day window."
          fi

      - name: Compose issue body
        if: steps.scan.outputs.stale == 'true'
        shell: bash
        run: |
          cat > issue-body.md <<'EOF'
          # Sources Verified badges are stale (>180 days)

          The following resource files carry a `Sources Verified (YYYY-MM-DD)` badge that is now older than 180 days. The badge is intended as a freshness signal for AAA-tier facts (regulations, recovery cases, platform policies). Please re-verify and bump the date.

          ## Stale files
          EOF
          cat stale-list.md >> issue-body.md
          cat >> issue-body.md <<'EOF'

          ## How to refresh
          1. Re-confirm the cited facts (links still valid, regulations still in force, dates still correct)
          2. If something changed, update the file accordingly
          3. Bump the `Sources Verified (YYYY-MM-DD)` line to today's UTC date
          4. Open a PR titled `docs: refresh Sources Verified badges`

          *Auto-generated by `.github/workflows/sources-verified-freshness.yml`. Closes when re-verification PR lands.*
          EOF

      - name: Open or update tracking issue
        if: steps.scan.outputs.stale == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "[maintenance] Sources Verified badges are stale (>180 days)"
          content-filepath: issue-body.md
          labels: |
            maintenance
            stale-sources
